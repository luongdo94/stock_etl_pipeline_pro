# etl_config.yaml — ETL pipeline configuration (read by etl/config_manager.get_etl_config)
# Every value here is used by the pipeline; defaults live in config_manager.py.

extraction:
  max_workers: 8              # threads for per-ticker price-currency lookups (other extractors keep their own conservative pools)
  insiders: true              # SEC Form 4 insider transactions / 6-month summary (US listings only)

incremental_load:
  lookback_days_full: 1825        # history pulled on a full refresh and when a ticker's price history is rebased
  overlap_buffer_days: 2          # days re-downloaded before each ticker's watermark (also used to detect dividend/split drift)

# Age after which a non-fast run refetches these. Under a week (144 h = 6 days), so the weekly non-fast run of the
# Airflow DAG (Mondays) always finds last Monday's data due, even when it starts a few minutes earlier than last time.
refresh_intervals:
  fundamentals_hours: 144   # quarterly statements, cash flows, forward estimates
  metadata_hours: 144       # company info, annual statements
  earnings_hours: 144       # earnings calendar
  insider_hours: 144        # insider transactions + summary

price_integrity:
  drift_tolerance: 0.002    # median |new/stored - 1| over the overlap days that triggers a full re-pull of that ticker
  rebase_every_days: 7      # every ticker's price history is re-pulled at least this often (adjusted closes drift with every dividend)
  min_rebase_ratio: 0.5     # a re-pull returning fewer than this share of the stored rows is ignored (keeps the old history)

universe:
  discovery_retention_days: 30   # an auto-discovered ticker stays in the universe this long after it last appeared in a TradingView screen

# Gates on the shadow warehouse before it replaces production. critical = abort the swap, warning = logged + shown in the dashboard.
gates:
  min_universe_coverage: 0.90      # tickers with prices / tickers in the universe
  min_vs_previous_tickers: 0.95    # tickers with prices / tickers in the previous production warehouse
  min_vs_previous_rows: 0.97       # raw price rows / previous production rows
  max_stale_days: 5                # newest price date must be at most this old (weekends/holidays fit in 5)
  min_fresh_share: 0.90            # tickers whose last price is within 4 days of the newest date -> warning below this
  critical_fresh_share: 0.50       # ... and critical below this (a partial download that left most tickers stale)
  min_compared: 20                 # continuity checks need at least this many tickers present in both warehouses
  min_moved: 3                     # ... and a break needs at least this many tickers (one split is a corporate action, not a bug)
  max_jump_pct_systemic: 0.02      # share of tickers whose last close moved > continuity_move vs the previous warehouse -> critical
  continuity_move: 0.25            # one-run move that counts as a discontinuity (unit / FX / split bug)
  mcap_ratio_bounds: [0.5, 2.0]    # market cap vs previous warehouse; outside bounds counts as a unit / FX discontinuity
  max_mcap_share: 0.05             # share of tickers outside the bounds above -> critical
  min_company_coverage: 0.80       # universe tickers with a company row that has a market cap / universe size
  min_vs_previous_fundamentals: 0.95  # annual statements / annual cash flows / payout: tickers and rows vs previous production

# Security lifecycle and history audit (per ticker; never fails a run — written to marts.etl_exceptions).
lifecycle:
  inactive_after_days: 10     # last price this many calendar days before the newest date -> INACTIVE (delisted / renamed /
                              # suspended): recorded with its last date and price, excluded from new score snapshots
  unexplained_jump_pct: 40    # full-history audit: |daily return| above this ...
  market_quiet_pct: 5         # ... on a day the benchmark moved less than this -> corporate-action / data-error candidate

# Provider guard (etl/fetch_guard.py): how the extractors react when Yahoo refuses requests or has no data.
provider:
  block_share: 0.3          # a batch with at least this share of refused tickers triggers a cool-down
  cooldown_base_s: 30       # first cool-down; doubles on each consecutive refused batch ...
  cooldown_cap_s: 300       # ... up to this
  cooldown_budget_s: 900    # total cool-down per extractor and run; past it the circuit opens (no more requests)
  retry_pause_s: 1.5        # pause between single-ticker retries
  no_data_ttl_days: 14      # a ticker the provider has no data for is not asked again (per extractor) for this long

# Independent-source reconciliation (etl/reconcile.py): Yahoo vs TradingView (last close, all markets) and SEC EDGAR
# (annual revenue / net income of US filers; needs SEC_USER_AGENT="Your Name you@example.com" in .env).
reconcile:
  enabled: true
  price_tolerance_pct: 1.5        # last close vs TradingView's last price or previous close
  fundamental_tolerance_pct: 3.0  # annual revenue / net income vs the SEC filing (definitions differ slightly)
  sec_max_tickers_per_run: 60     # rotating sample (least recently checked first); SEC allows ≤ 10 requests / second
  min_compared: 30                # the systemic gates below need at least this many compared tickers
  warn_mismatch_share: 0.05       # share of compared prices that disagree -> warning
  critical_mismatch_share: 0.25   # ... -> critical: Yahoo's prices are broken for a large part of the universe

filings:                          # SEC filings as text for research (RAG) and finance-lease evidence (etl/filings.py)
  enabled: true                   # needs SEC_USER_AGENT; embedding / lease reading also need COHERE_API_KEY
  max_tickers_per_run: 40         # US issuers whose filing list is read per full run (lease targets first); fast runs: none
  recheck_days: 7
  annual_reports: 3               # 10-Ks kept per issuer (three fiscal years of lease evidence); full text only for the latest
  earnings_releases: 4            # 8-K Item 2.02 press releases kept in full
  embed: true
  embed_model: embed-v4.0
  embed_dimension: 512
  embed_tokens_per_minute: 90000   # a Cohere TRIAL key allows 100k tokens/min and 1,000 calls/month per endpoint
  rerank_model: rerank-v3.5
  extract_leases: true            # read finance-lease principal out of the 10-K; accepted only with a verbatim quote
  max_lease_readings_per_run: 40  # LLM calls per run (one per 10-K; the newest usually covers three years)
  llm_calls_per_minute: 18        # trial key: 20 calls / minute
  llm_model: command-r-plus-08-2024   # lease reading (validated in the pilot against SEC XBRL)
  answer_model: command-a-03-2025     # cited research answers in the app

swap:
  attempts: 60            # os.replace retries while a dashboard connection still holds the production file
  wait_seconds: 2.0

data_quality:
  min_price: 0.01
  max_pe_ratio: 1000
  max_debt_ebitda: 50
  min_market_cap: 1000000
  jump_pct: 60            # |daily return| above this in the last 10 days is flagged (split / unit error candidate)
  jump_systemic_tickers: 3  # ... and is critical when more than max(this, 2% of the universe) tickers jump
