# decision_rules.yaml — assumptions behind the Decision Summary (edit to match your broker / tax)

costs:
  base_currency: EUR
  commission_pct: 0.10        # per side, % of trade value
  fx_spread_pct: 0.25         # per conversion, only when the stock is not in base_currency
  # Dividend withholding tax actually lost after treaty relief, by country (fraction of dividend)
  dividend_withholding:
    United States: 0.15
    Switzerland: 0.35
    Germany: 0.26
    France: 0.25
    Japan: 0.15
    United Kingdom: 0.0
    default: 0.15

risk:
  account_risk_pct: 1.0       # max % of portfolio lost if the stop is hit
  max_position_pct: 10.0      # hard cap per position
  min_reward_risk: 2.0        # expected upside / downside required for a BUY candidate
  earnings_blackout_days: 7   # warn before buying this close to an earnings release
  min_stop_pct: 8.0           # thesis stop is never tighter than this (valuation theses need room)

valuation:
  # DCF verdicts are very sensitive to these two numbers — change them deliberately.
  equity_risk_premium: 0.05   # cost of equity = 10Y yield + Blume beta x ERP
  required_margin_of_safety: 0.25   # BUY needs base value >= price x 1.25; AVOID needs price > bull case
  stale_price_days: 5         # price older than this lowers confidence
  stale_fundamentals_days: 35

scores:
  min_quality_for_buy: 50       # a BUY CANDIDATE needs Quality >= this: cheap-and-weak is the classic value trap
  value_crosscheck_below: 30    # DCF says cheap but the Value score (multiples vs peers) is below this -> confidence note
  min_coverage_pct: 60          # below this share of observable scoring inputs -> confidence note
