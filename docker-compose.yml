# One-shot ETL container:   docker compose run --rm pipeline            (add `python run.py --full` to rebuild)
# Schedule it with the host's scheduler (cron / Windows Task Scheduler: scripts/windows/register_daily_etl.ps1) — there is no
# Airflow service any more: its dags/ folder was never part of this repository.
# Notifications and cloud sync read their settings from .env (SMTP_*, ETL_WEBHOOK_URL, SUPABASE_*).
services:
  pipeline:
    image: python:3.13-slim          # same interpreter as CI and the dashboard image (audit F27)
    working_dir: /app
    volumes:
      - .:/app
      - ./warehouse:/app/warehouse
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
      - PYTHONIOENCODING=utf-8
    command: >
      bash -c "pip install -r requirements.lock -q && python run.py"
    restart: "no"

  # Scheduler: python run.py --fast at 07:30 Europe/Berlin, Mon-Sat (infra/airflow/dags/stock_etl_dag.py).
  #   docker compose --profile airflow up -d --build airflow      UI http://localhost:8080 (admin password: docker compose logs airflow)
  # Needs Docker Desktop running whenever the schedule should fire. The ETL mails its own report (SMTP_* in .env).
  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/opt/project
      - ./infra/airflow/dags:/opt/airflow/dags:ro
      - airflow_home:/opt/airflow/state
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Berlin
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
      TZ: Europe/Berlin
    # With AIRFLOW_ADMIN_PASSWORD in .env the admin account ("admin") gets THAT password on every start (created, then reset); without it Airflow makes a random one (docker exec ... cat /opt/airflow/standalone_admin_password.txt).
    entrypoint: ["bash", "-c"]
    command:
      - |
        airflow db migrate
        if [ -n "$$AIRFLOW_ADMIN_PASSWORD" ]; then
          # "users create" exits 0 even when admin exists, so the reset always follows
          airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@localhost             --password "$$AIRFLOW_ADMIN_PASSWORD" >/dev/null 2>&1
          airflow users reset-password --username admin --password "$$AIRFLOW_ADMIN_PASSWORD" >/dev/null 2>&1
        fi
        exec airflow standalone
    restart: unless-stopped

volumes:
  airflow_home:
