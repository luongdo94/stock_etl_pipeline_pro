[theme]
font = "system-ui, -apple-system, Roboto, 'Segoe UI', sans-serif"
headingFont = "system-ui, -apple-system, Roboto, 'Segoe UI', sans-serif"
baseRadius = "22px"
buttonRadius = "full"
showWidgetBorder = false
chartCategoricalColors = ["#3E91FF", "#25C974", "#FF7A00", "#8E54E9", "#00C7B6", "#FF4961", "#FFB800", "#6366F1"]

[theme.light]
primaryColor = "#1269D3"
backgroundColor = "#F6F6F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#000000"
linkColor = "#1269D3"
borderColor = "#E8E8E8"

[theme.dark]
primaryColor = "#3E91FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#171717"
textColor = "#FAFAFA"
linkColor = "#3E91FF"
borderColor = "#262626"
