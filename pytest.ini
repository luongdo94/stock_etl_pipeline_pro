[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: renders the full Streamlit app against a synthetic warehouse (slower; skip with -m "not smoke")
    live: hits Yahoo Finance to sanity-check EUR units (skipped unless RUN_LIVE=1)
filterwarnings =
    ignore::DeprecationWarning
